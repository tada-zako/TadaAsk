# Console、Widget 与 API 的公共 server 配置
server {
    listen 80;
    server_name _;
    server_tokens off; # 关闭 nginx 版本号显示

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/plain;

    # nginx 运行状态检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /api {
        return 308 /api/; # 重定向
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/; # /api/xxx 请求实际转发到 http://backend:8000/xxx
        proxy_http_version 1.1;

        # 设置代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 带上完整的 XFF IP 链路
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传请求的协议
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # 流式响应优化
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location = /widget/tada-ask-widget.js {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /widget/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /widget/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        # SPA 处理，所有剩余请求返回 /index.html
        try_files $uri $uri/ /index.html;
    }
}
