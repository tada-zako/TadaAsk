[project]
name = "tadaask-backend"
version = "0.1.0"
description = "TadaAsk self-hosted RAG assistant backend"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "cryptography>=49.0.0",
    "deprecated>=1.3.1",
    "fastapi[standard]>=0.135.3",
    "fastembed>=0.8.0",
    "google-genai>=1.70.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "markitdown[docx]>=0.1.6",
    "openai>=2.30.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-ai>=2.13.0",
    "pydantic-extra-types==2.11.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymupdf4llm>=1.27.2.3",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.12.0",
    "tokenizers>=0.22.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
local-gpu = ["llama-cpp-python>=0.3.23"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "storages",
    "models--*",
]
